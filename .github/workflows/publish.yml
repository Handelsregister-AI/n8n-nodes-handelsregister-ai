name: Publish to npm

# Triggers:
# - Push a tag matching v*.*.*  → publishes the package at that tag
# - Manual run from the Actions tab → publishes whatever is on the chosen branch
#
# Authentication is handled via npm Trusted Publishers (OIDC). No NPM_TOKEN
# secret is required — npm verifies this workflow directly via the GitHub
# OIDC token (id-token: write). Provenance is generated automatically.
#
# Trusted publisher must be configured at:
#   https://www.npmjs.com/package/@handelsregister/n8n-nodes-handelsregister-ai/access
# with workflow filename `publish.yml`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do NOT set `registry-url` here. With Trusted Publishers, registry-url
      # writes an `.npmrc` containing `_authToken=${NODE_AUTH_TOKEN}`, which
      # resolves to an empty string and pre-empts OIDC auth, causing the
      # registry PUT to 404 with "auth failed".
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
