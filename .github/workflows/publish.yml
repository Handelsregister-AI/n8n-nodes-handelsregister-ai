name: Publish to npm

# Triggers:
# - Push a tag matching v*.*.*  → publishes the package at that tag
# - Manual run from the Actions tab → publishes whatever is on the chosen branch
#
# Authentication is handled via npm Trusted Publishers (OIDC). No NPM_TOKEN
# secret is required — npm verifies this workflow directly via the GitHub
# OIDC token (id-token: write). Provenance is generated automatically.
#
# Trusted publisher must be configured at:
#   https://www.npmjs.com/package/@handelsregister/n8n-nodes-handelsregister-ai/access
# with workflow filename `publish.yml`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned versions:
      # - Node 22.18.0 — last 22.x line with a working pre-cached npm. Node
      #   22.22.2 ships with a broken npm 10.9.7 (missing promise-retry).
      #   See actions/runner-images#13883.
      # - npm 11.11.0 — first version with the promise-retry fix landed and
      #   the minimum recommended for Trusted Publishers OIDC publishing
      #   (TP needs npm >= 11.5.1, but 11.5–11.10 hit the same toolcache bug).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm to 11.11.0 (Trusted Publishers OIDC requires >= 11.5.1)
        run: npm install -g npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm run audit

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
